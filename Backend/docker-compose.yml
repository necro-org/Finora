services:
  api:
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      - db
  db:
    image: postgres:18.1
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: finora
      PGDATA: /var/lib/postgresql/data
    volumes:
      - finora-db:/var/lib/postgresql/data

volumes:
  finora-db:
