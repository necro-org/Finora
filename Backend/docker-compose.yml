name: finora

services:
  finora-api:
    image: ${DOCKER_REGISTRY-}finora-api
    container_name: finora-api
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      - finora-db
  finora-db:
    image: postgres:18.1
    container_name: finora-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: finora
      PGDATA: /var/lib/postgresql/data
    volumes:
      - finora-db-data:/var/lib/postgresql/data

volumes:
  finora-db-data:
    name: finora-db-data
